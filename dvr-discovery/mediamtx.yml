# MediaMTX configuration for TVB3708BS_F DVR
# Pulls RTSP from all 8 channels, serves HLS + WebRTC
# Run: mediamtx.exe mediamtx.yml
# HLS URLs: http://HOST:8888/cam{ch}_{type}/index.m3u8

rtsp: yes
rtspAddress: :8554
rtmp: no
hls: yes
hlsAddress: :8888
hlsSegmentCount: 6
hlsSegmentDuration: 2
webrtc: yes
webrtcAddress: :8889

paths:
  cam1_main:
    source: rtsp://rick:2017@192.168.0.245:554/h264/ch1/main/av_stream
    sourceProtocol: tcp
  cam1_sub:
    source: rtsp://rick:2017@192.168.0.245:554/h264/ch1/sub/av_stream
    sourceProtocol: tcp

